<!DOCTYPE html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Notable&family=Outfit:wght@100..900&family=Zen+Dots&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="index.css">
</head>

<body>
    <h1>Create Your Pokemon</h1>

    <a href="types.html" class="link">Make Another</a>

    <br />

    <table class="creation-table">
        <tr>
            <td><label for="pokemon_name" class="form-label">Name your Pokemon</label></td>
            <td>
                <input id="pokemon_name" type="text">
                <div id="error-pokemon_name" class="error"></div>
            </td>
        </tr>
    </table>

    <br />

    <button id="submit-pokemon" class="zen-dots-regular shakey-shake">Create Pokemon</button>

    <div id="message-banner"></div>

    <div id="output" class="overflow italic">
        Table will appear here.
    </div>

    <br />

    <label>Want to replace an existing Pokemon with yours? Click the button below.</label>
    <button id="edit-pokemon-button" class="zen-dots-regular you-sure">Replace Existing Pokemon</button>

    <script>
        const displayValue = (value) => value === null ? 'None' : value;

        const showBanner = (message, isError = false) => {
            const banner = document.getElementById('message-banner');
            banner.innerHTML = '<p class="' + (isError ? 'error' : 'success') + '">' + message + '</p>';
        };

        const clearBanner = () => {
            document.getElementById('message-banner').innerHTML = '';
        };

        document.getElementById('submit-pokemon').addEventListener('click', () => {
            // Clear previous errors
            document.querySelectorAll('[id^="error-"]').forEach(el => el.innerHTML = '');

            const pokemonName = document.getElementById('pokemon_name').value.trim();

            const formData = new FormData();
            formData.append('pokemon_name', pokemonName);

            fetch("http://localhost:3000/pokemon-characters", {
                method: 'POST',
                body: formData
            })
                .then(response => response.json().then(data => ({ status: response.status, data })))
                .then(({ status, data }) => {
                    const outputEl = document.getElementById('output');
                    clearBanner();
                    if (status === 400) {
                        if (data.errors) {
                            data.errors.forEach(err => {
                                const errorDiv = document.getElementById(`error-${err.path}`);
                                if (errorDiv) {
                                    errorDiv.innerHTML = err.msg;
                                }
                            });
                        }
                        showBanner(data.message || ' ', true);
                    } else if (status === 200) {
                        showBanner(data.message || 'Pokemon created successfully.');
                        let displayTable =
                            '<table>' +
                            '<thead>' +
                            '<tr>' +
                            '<th class="table-border">Name</th>' +
                            '<th class="table-border">Type 1</th>' +
                            '<th class="table-border">Type 2</th>' +
                            '<th class="table-border">Gimmick</th>' +
                            '<th class="table-border">Gen</th>' +
                            '</tr>' +
                            '</thead>' +
                            '<tbody>';

                        data.allData.forEach(mon => {
                            displayTable += '<tr>' +
                                '<td class="table-border">' + displayValue(mon.name) + '</td>' +
                                '<td class="table-border">' + displayValue(mon.first_type) + '</td>' +
                                '<td class="table-border">' + displayValue(mon.second_type) + '</td>' +
                                '<td class="table-border">' + displayValue(mon.gimmick) + '</td>' +
                                '<td class="table-border">' + displayValue(mon.gen) + '</td>' +
                                '</tr>';
                        });

                        displayTable += '</tbody></table>';

                        outputEl.classList.remove('italic');
                        outputEl.innerHTML = displayTable;
                    } else {
                        outputEl.classList.remove('italic');
                        outputEl.innerHTML = '<p class="error">Error creating Pokemon</p>';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    const outputEl = document.getElementById('output');
                    outputEl.classList.remove('italic');
                    outputEl.innerHTML = '<p class="error">Error creating Pokemon</p>';
                });
        });

        document.getElementById('edit-pokemon-button').addEventListener('click', () => {
            window.location.href = 'edit.html';
        });
    </script>
</body>

</html>
