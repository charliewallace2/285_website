<!DOCTYPE html>
<html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Notable&family=Outfit:wght@100..900&family=Zen+Dots&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <h1>Edit Existing Pokemon</h1>

    <div id="replace-warning">
        <label>WARNING: Clicking an edit button will permanently replace that Pokemon with the one you created.</label>
    </div>

    <br />

    <a href="build.html" class="link">Go Back</a>

    <div id="message-banner"></div>

    <div id="latest-pokemon" class="overflow italic">
        Latest created Pokemon will appear here.
    </div>

    <div id="output" class="overflow italic">
        Table should appear here. If you're reading this, something is very wrong.
    </div>

    <script>
        const displayValue = (value) => value === null ? 'None' : value;

        const renderLatestPokemon = (pokemon) => {
            const latestEl = document.getElementById('latest-pokemon');
            if (!pokemon) {
                latestEl.classList.remove('italic');
                latestEl.innerHTML = '<p class="no-results">No created Pokemon available yet.</p>';
                return;
            }

            latestEl.classList.remove('italic');
            latestEl.innerHTML = '<label class="bold">Your Created Pokemon:</label> ' +
                displayValue(pokemon.name) + ' / ' +
                displayValue(pokemon.first_type) + ' / ' +
                displayValue(pokemon.second_type) + ' / ' +
                displayValue(pokemon.gimmick) + ' / Gen ' +
                displayValue(pokemon.gen);
        };

        const renderPokemonCharacters = (data) => {
            if (!data || data.length === 0) {
                document.getElementById('output').classList.remove('italic');
                document.getElementById('output').innerHTML = '<p class="no-results">No Pokemon characters available.</p>';
                return;
            }

            let displayTable = '<table>' +
                '<thead>' +
                '<tr>' +
                '<th class="table-border">Name</th>' +
                '<th class="table-border">Type 1</th>' +
                '<th class="table-border">Type 2</th>' +
                '<th class="table-border">Gimmick</th>' +
                '<th class="table-border">Gen</th>' +
                '<th class="table-border">Actions</th>' +
                '</tr>' +
                '</thead>' +
                '<tbody>';

            data.forEach(row => {
                if (row.gimmick === 'Terastallizatio') {
                    row.gimmick = 'Tera Form';
                }

                displayTable += '<tr>' +
                    '<td class="table-border">' + displayValue(row.name) + '</td>' +
                    '<td class="table-border">' + displayValue(row.first_type) + '</td>' +
                    '<td class="table-border">' + displayValue(row.second_type) + '</td>' +
                    '<td class="table-border">' + displayValue(row.gimmick) + '</td>' +
                    '<td class="table-border">' + displayValue(row.gen) + '</td>' +
                    '<td class="table-border">' +
                        '<button class="edit-btn" data-pokemon-id="' + row.id + '">Edit</button> ' +
                        '<a href="character.html?id=' + row.id + '" class="link">View</a>' +
                    '</td>' +
                    '</tr>';
            });

            displayTable += '</tbody></table>';
            const outputEl = document.getElementById('output');
            outputEl.classList.remove('italic');
            outputEl.innerHTML = displayTable;
        };

        const fetchPokemonCharacters = () => {
            fetch('/pokemon-characters/')
                .then(response => response.json())
                .then(data => {
                    renderPokemonCharacters(data.data);
                })
                .catch(error => {
                    console.error('Error fetching pokemon characters:', error);
                    const outputEl = document.getElementById('output');
                    outputEl.classList.remove('italic');
                    outputEl.innerHTML = '<p class="error">Unable to load pokemon characters.</p>';
                });
        };

        const fetchLatestCreatedPokemon = () => {
            fetch('/pokemon-characters/latest')
                .then(response => response.json())
                .then(data => {
                    renderLatestPokemon(data.data);
                })
                .catch(error => {
                    console.error('Error fetching latest pokemon:', error);
                    renderLatestPokemon(null);
                });
        };

        const showBanner = (message, isError = false) => {
            const banner = document.getElementById('message-banner');
            banner.innerHTML = '<p class="' + (isError ? 'error' : 'success') + '">' + message + '</p>';
        };

        const replacePokemon = (targetId) => {
            fetch('/pokemon-characters/latest')
                .then(response => response.json())
                .then(data => {
                    if (!data.data || !data.data.id) {
                        throw new Error('No created Pokemon available to use for replacement.');
                    }

                    const formData = new FormData();
                    formData.append('source_id', data.data.id);

                    return fetch('/pokemon-characters/' + targetId, {
                        method: 'PUT',
                        body: formData
                    });
                })
                .then(response => response.json().then(data => ({ status: response.status, data })))
                .then(({ status, data }) => {
                    if (status === 400 || status === 404) {
                        showBanner(data.message || 'Unable to replace Pokemon.', true);
                    } else if (status === 200) {
                        showBanner(data.message);
                        fetchPokemonCharacters();
                        fetchLatestCreatedPokemon();
                    } else {
                        showBanner('Unexpected response from server.', true);
                    }
                })
                .catch(error => {
                    console.error('Error replacing pokemon:', error);
                    showBanner(error.message || 'Error replacing Pokemon.', true);
                });
        };

        window.addEventListener('DOMContentLoaded', () => {
            fetchPokemonCharacters();
            fetchLatestCreatedPokemon();

            document.getElementById('output').addEventListener('click', (event) => {
                if (!event.target.matches('.edit-btn')) {
                    return;
                }

                const pokemonId = event.target.getAttribute('data-pokemon-id');
                if (!pokemonId) {
                    showBanner('Unable to determine the selected Pokemon ID.', true);
                    return;
                }

                replacePokemon(pokemonId);
            });
        });
    </script>
</body>

</html>
